services:
  postgres_db:
    image: postgres:16-alpine # Используем легкую версию Postgres
    container_name: tastemap_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SuperSecretPassword123!
      POSTGRES_DB: TasteMapDb
    ports:
      - "5432:5432" # Пробрасываем порт из контейнера наружу
    volumes:
      - postgres_data:/var/lib/postgresql/data # Чтобы данные не удалились при перезапуске контейнера

volumes:
  postgres_data: