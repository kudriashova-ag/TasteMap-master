databases:
  - name: tastemap-db
    plan: free
    region: frankfurt
    databaseName: tastemapdb

services:
  - type: web
    name: tastemap-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tastemap-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: FrontendUrl
        sync: false
      - key: EmailSettings__Password
        sync: false

  - type: web
    name: tastemap-frontend
    runtime: static
    rootDir: tastemap-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
